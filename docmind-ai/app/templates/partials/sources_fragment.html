{% if filenames %}
<div class="mt-2 pt-2 border-top">
    <p class="small text-secondary mb-1 fw-medium">Sources</p>
    {% for filename in filenames %}
    <p class="small text-secondary mb-0"><i class="bi bi-file-earmark-pdf text-danger me-1"></i>{{ filename }}</p>
    {% endfor %}
</div>
{% endif %}
