{% extends "base.html" %}
{% block title %}DocMind AI — Chat{% endblock %}
{% block content %}
<div class="mx-auto chat-shell" style="max-width: 720px;">
    <h1 class="h3 fw-semibold mb-1">Chat</h1>
    <p class="text-secondary mb-4">Ask a question about your uploaded documents.</p>

    <div class="chat-window mb-3" id="chat-window">
        <div class="chat-bubble chat-bubble-assistant">
            Hi! Upload some documents, then ask me anything about them.
        </div>
    </div>

    <form class="d-flex gap-2" hx-post="/chat/message" hx-target="#chat-window" hx-swap="beforeend" hx-on::after-request="this.reset()">
        <input type="text" name="message" class="form-control" placeholder="Ask a question..." autocomplete="off" required>
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send"></i></button>
    </form>
</div>
{% endblock %}
