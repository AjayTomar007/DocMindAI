services:
  - name: docmind-web
    type: web
    runtime: docker
    plan: free
    dockerContext: ./docmind-ai
    dockerfilePath: ./docmind-ai/Dockerfile
    dockerCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docmind-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: docmind-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: docmind-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: docmind-redis
          type: keyvalue
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_DIM
        value: "1536"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"

  - name: docmind-redis
    type: keyvalue
    plan: free
    ipAllowList: []

databases:
  - name: docmind-db
    plan: free
    databaseName: docmind
    user: docmind
